<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jewellery With Love Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F5F5F2; --surface:#FFFFFF; --surface-2:#EDEDE9; --surface-3:#E4E4DE;
  --ink:#1A1C22; --ink-2:#4A4F5C; --ink-3:#7A8090;
  --line:#DEDED8; --line-2:#C7C7BF;
  --accent:#2B4C8C; --accent-soft:#E3EAF7; --accent-ink:#1E3A6E;
  --crit:#B3261E; --crit-soft:#FAE6E4;
  --high:#AC5B0B; --high-soft:#F9ECDF;
  --med:#856500; --med-soft:#F6EFD6;
  --low:#6C7280; --low-soft:#EAEBEE;
  --good:#1F6F52; --good-soft:#E1F0E9;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 6px 16px rgba(20,22,28,.05);
  --shadow-lg:0 12px 40px rgba(20,22,28,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13151A; --surface:#1B1E25; --surface-2:#232731; --surface-3:#2C313C;
  --ink:#EDEEF1; --ink-2:#B2B7C3; --ink-3:#7E8492;
  --line:#2B303A; --line-2:#3B414D;
  --accent:#8CB0F2; --accent-soft:#1D2A42; --accent-ink:#BFD3F8;
  --crit:#F0857A; --crit-soft:#3A1E1B;
  --high:#E2A468; --high-soft:#332515;
  --med:#D8BE64; --med-soft:#2D2716;
  --low:#99A0AC; --low-soft:#262A33;
  --good:#6FC69E; --good-soft:#14291F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --paper:#13151A; --surface:#1B1E25; --surface-2:#232731; --surface-3:#2C313C;
  --ink:#EDEEF1; --ink-2:#B2B7C3; --ink-3:#7E8492;
  --line:#2B303A; --line-2:#3B414D;
  --accent:#8CB0F2; --accent-soft:#1D2A42; --accent-ink:#BFD3F8;
  --crit:#F0857A; --crit-soft:#3A1E1B;
  --high:#E2A468; --high-soft:#332515;
  --med:#D8BE64; --med-soft:#2D2716;
  --low:#99A0AC; --low-soft:#262A33;
  --good:#6FC69E; --good-soft:#14291F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:214px 1fr;height:100%;min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-top:env(safe-area-inset-top,0px)}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand .mark{font-family:"Instrument Serif",Georgia,serif;font-size:23px;line-height:1.08;letter-spacing:.1px;display:block}
.brand .sub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px;display:block}
.who{padding:12px 14px;border-bottom:1px solid var(--line)}
.who label{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.who select{width:100%;padding:6px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface-2);font-size:13px;font-weight:500}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;min-height:0}
.nav-b{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav-b:hover{background:var(--surface-2);color:var(--ink)}
.nav-b[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-b .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.42;flex:none}
.nav-b[aria-current="page"] .dot{opacity:1}
.nav-b .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);font-weight:500}
.nav-b[aria-current="page"] .n{color:var(--accent-ink)}
.nav-b .n.alert{color:var(--crit);font-weight:600}
.rail-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.add-btn{flex:1;background:var(--accent);color:#fff;padding:9px 12px;border-radius:7px;font-weight:600;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:7px}
:root[data-theme="dark"] .add-btn,:root:not([data-theme="light"]) .add-btn{color:#0F131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .add-btn{color:#fff}}
.add-btn:hover{filter:brightness(1.08)}
.icon-btn{width:34px;height:34px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

main{overflow-y:auto;min-height:0;padding:0 0 64px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:25px;letter-spacing:-.015em}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}

/* ---------- pieces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:12px;font-family:"IBM Plex Mono",monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.panel-h .link{font-size:12px;color:var(--accent);font-weight:500}

.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.stat .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.stat.is-crit .v{color:var(--crit)} .stat.is-high .v{color:var(--high)}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

/* task rows */
.tlist{display:flex;flex-direction:column}
.trow{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;position:relative}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface-2)}
.tick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);flex:none;margin-top:1px;display:grid;place-items:center;background:var(--surface)}
.tick:hover{border-color:var(--good);background:var(--good-soft)}
.tick svg{opacity:0;width:11px;height:11px}
.tick:hover svg{opacity:.55}
.trow.done .tick{background:var(--good);border-color:var(--good)}
.trow.done .tick svg{opacity:1;color:var(--surface)}
.tbody{flex:1;min-width:0}
.ttitle{font-weight:500;overflow-wrap:anywhere}
.trow.done .ttitle{color:var(--ink-3);text-decoration:line-through}
.tmeta{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:3px;font-size:11.5px;color:var(--ink-3);align-items:center}
.pbar{width:3px;border-radius:2px;flex:none;align-self:stretch;margin:2px 0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.high{background:var(--high-soft);color:var(--high)}
.pill.med{background:var(--med-soft);color:var(--med)}
.pill.low{background:var(--low-soft);color:var(--low)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.flat{background:var(--surface-2);color:var(--ink-2)}
.pdot{width:6px;height:6px;border-radius:50%;flex:none}
.due{font-family:"IBM Plex Mono",monospace;font-size:11px}
.due.over{color:var(--crit);font-weight:500}
.due.today{color:var(--high);font-weight:500}
.empty{padding:22px 14px;color:var(--ink-3);font-size:13px;text-align:center}
.sect-h{display:flex;align-items:center;gap:8px;padding:11px 14px 7px;border-bottom:1px solid var(--line)}
.sect-h .t{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:500}
.sect-h .c{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);margin-left:auto}
.sect-h.over .t{color:var(--crit)} .sect-h.must .t{color:var(--high)} .sect-h.wait .t{color:var(--ink-2)}

/* projects */
.prj{padding:12px 14px;border-bottom:1px solid var(--line);display:block;width:100%;text-align:left}
.prj:last-child{border-bottom:0}
.prj:hover{background:var(--surface-2)}
.prj-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.prj-name{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.prj-pct{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.track{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.track span{display:block;height:100%;border-radius:3px}
.prj-foot{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:7px;font-size:11.5px;color:var(--ink-3);align-items:center}
.health{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.health .hd{width:7px;height:7px;border-radius:50%}
.h-good{color:var(--good)} .h-warn{color:var(--high)} .h-bad{color:var(--crit)}

/* team table */
table.team{width:100%;border-collapse:collapse}
table.team th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;text-align:right;padding:9px 14px 7px;border-bottom:1px solid var(--line)}
table.team th:first-child{text-align:left}
table.team td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13px}
table.team tr:last-child td{border-bottom:0}
table.team td:first-child{text-align:left;font-family:"Archivo",sans-serif;font-weight:500}
table.team tbody tr:hover{background:var(--surface-2);cursor:pointer}
td.over-n{color:var(--crit);font-weight:600}
td.zero{color:var(--ink-3)}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;
  color:#fff;margin-right:8px;vertical-align:-6px;letter-spacing:.02em}

.load{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.load:last-child{border-bottom:0}
.load .nm{width:76px;font-weight:500;flex:none}
.load .bar{flex:1;height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.load .bar span{display:block;height:100%}
.load .lv{font-size:11px;font-weight:600;width:72px;text-align:right;flex:none}

/* hero project cards */
.herorow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.herocard{border-radius:12px;padding:14px 15px;border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.herocard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.herocard-name{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;line-height:1.25}
.herocard-due{font-size:11px;color:var(--ink-2);margin-top:2px}
.tlight{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px 3px 6px;border-radius:20px;flex:none;white-space:nowrap}
.tlight .hd{width:7px;height:7px;border-radius:50%;flex:none}
.tlight.tl-good{background:var(--good-soft);color:var(--good)}
.tlight.tl-warn{background:var(--high-soft);color:var(--high)}
.tlight.tl-bad{background:var(--crit-soft);color:var(--crit)}
.herocard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.stack-avatars{display:flex;align-items:center}
.stack-avatars .avatar{margin-right:-8px;border:2px solid var(--surface);vertical-align:middle}
.stack-avatars .avatar:last-child{margin-right:0}
.herocard-pct{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--ink-2)}

/* traffic-light summary strip */
.trafficrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.traffic-chip{flex:1;min-width:140px;display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left}
.traffic-chip:hover{background:var(--surface-2)}
.traffic-chip .hd{width:10px;height:10px;border-radius:50%;flex:none}
.traffic-chip .tc-n{font-size:19px;font-weight:700;line-height:1}
.traffic-chip .tc-l{font-size:11px;color:var(--ink-3);margin-top:1px}

/* completion donut */
.donutcard{display:flex;align-items:center;gap:16px;padding:14px}
.donutcard svg{flex:none}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.donut-legend .dl-row{display:flex;align-items:center;gap:7px}
.donut-legend .hd{width:8px;height:8px;border-radius:2px;flex:none}
.donut-legend .dl-n{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
.donut-legend .dl-l{color:var(--ink-3)}

/* colored action rows (dashboard "my actions") */
.arow{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.arow:last-child{border-bottom:0}
.arow:hover{background:var(--surface-2)}
.aicon{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;margin-top:1px}
.aicon svg{width:15px;height:15px}
.abody{flex:1;min-width:0}
.atitle{font-weight:500;overflow-wrap:anywhere}
.ameta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}

/* filters / toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.bar select,.bar input[type=search]{padding:6px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:13px}
.bar input[type=search]{min-width:180px;flex:1;max-width:280px}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* calendar */
.cal-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2)}
.cal-nav button:hover{background:var(--surface-2);color:var(--ink)}
.cal-label{font-weight:600;font-size:15px;min-width:150px;text-align:center}
.cal-modes{display:flex;gap:4px;margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.cal-daylabel{background:var(--surface-2);padding:6px 4px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:center;min-width:0}
.cal-cell{background:var(--surface);min-height:104px;padding:5px 5px 4px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cal-cell.other-month{background:var(--paper)}
.cal-cell.other-month .cal-daynum{color:var(--ink-3)}
.cal-cell.drop-hover{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-daynum{font-family:"IBM Plex Mono",monospace;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.cal-cell.is-today .cal-daynum{background:var(--accent);color:#fff;font-weight:700}
:root[data-theme="dark"] .cal-cell.is-today .cal-daynum,:root:not([data-theme="light"]) .cal-cell.is-today .cal-daynum{color:#0F131B}
.cal-chips{display:flex;flex-direction:column;gap:2px;overflow:hidden;flex:1}
.cal-chip{font-size:10.8px;padding:2px 6px;border-radius:5px;display:flex;align-items:center;gap:5px;overflow:hidden;text-align:left;cursor:grab;background:var(--surface-2);min-width:0;width:100%}
.cal-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
.cal-chip.done{opacity:.5;text-decoration:line-through}
.cal-more{font-size:10px;color:var(--ink-3);padding-left:3px;text-align:left}
.cal-more:hover{color:var(--ink)}
.cal-week .cal-cell{min-height:340px;align-items:stretch}
.cal-week .cal-chip{white-space:normal}
.cal-day-list{max-width:640px}
@media (max-width:760px){
  .cal-cell{min-height:74px}
  .cal-week .cal-cell{min-height:220px}
}

/* stock */
table.stock{width:100%;border-collapse:collapse;min-width:640px}
table.stock th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
table.stock th:first-child,table.stock th:nth-child(2){text-align:left}
table.stock td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap}
table.stock td.stock-name{text-align:left;font-family:"Archivo",sans-serif;font-weight:500;white-space:normal}
table.stock td.stock-name button{text-align:left}
table.stock td.stock-name button:hover{text-decoration:underline}
table.stock td.stock-type{text-align:left;color:var(--ink-2)}
table.stock td.stock-actions{text-align:right;white-space:nowrap}
table.stock td.stock-actions .link{margin-right:10px;font-size:12px}
table.stock input.stock-qty{width:64px;text-align:right;padding:5px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface-2);font-family:"IBM Plex Mono",monospace;font-size:13px;color:inherit}
table.stock tr.stock-total-row td{font-weight:700;border-top:2px solid var(--line-2);border-bottom:none}
@media (max-width:760px){ table.stock{min-width:640px} }

/* capture */
.capture{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.capture input{flex:1;padding:9px 11px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2)}
.capture button{padding:9px 15px;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;font-size:13px}
:root[data-theme="dark"] .capture button,:root:not([data-theme="light"]) .capture button{color:#0F131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .capture button{color:#fff}}

/* modal + drawer */
.scrim{position:fixed;inset:0;background:rgba(15,17,22,.45);backdrop-filter:blur(2px);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);width:min(480px,100%);max-height:88vh;overflow:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);
  box-shadow:var(--shadow-lg);z-index:61;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.m-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--surface);z-index:2}
.m-h h2{font-size:15px}
.m-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.m-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
  position:sticky;bottom:0;background:var(--surface)}
.field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface-2)}
.field textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:8px 14px;border-radius:7px;border:1px solid var(--line-2);font-weight:500;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#0F131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft)}
.sub-list{display:flex;flex-direction:column;gap:6px}
.sub-i{display:flex;align-items:center;gap:8px;font-size:13px}
.sub-i input[type=checkbox]{width:15px;height:15px;accent-color:var(--good);flex:none}
.sub-i span{flex:1;min-width:0;overflow-wrap:anywhere}
.sub-i.done span{text-decoration:line-through;color:var(--ink-3)}
.sub-i button{color:var(--ink-3);font-size:16px;line-height:1;padding:0 4px}
.sub-i button:hover{color:var(--crit)}

.banner{background:var(--med-soft);color:var(--med);padding:8px 14px;font-size:12.5px;text-align:center;border-bottom:1px solid var(--line)}
.note{font-size:12px;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:900px){
  .grid2{grid-template-columns:1fr}
  .statrow{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);flex-direction:column}
  .brand{padding:12px 16px 10px;display:flex;align-items:baseline;gap:10px;justify-content:space-between}
  .brand .sub{margin-top:0}
  .who{display:flex;align-items:center;gap:10px;padding:9px 16px}
  .who label{margin:0}
  .who select{width:auto;flex:1;max-width:190px}
  nav{flex-direction:row;overflow-x:auto;padding:7px 10px;gap:5px;flex:none}
  .nav-b{white-space:nowrap;width:auto;padding:6px 11px}
  .nav-b .dot{display:none}
  .nav-b .n{margin-left:3px}
  .rail-foot{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  main{padding-bottom:78px}
  .wrap{padding-inline:16px}
  .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="mark">Jewellery With&nbsp;Love</span>
      <span class="sub">Planner</span>
    </div>
    <div class="who">
      <label for="me-select">Signed in as</label>
      <select id="me-select"></select>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <button class="add-btn" id="quick-add">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add task
      </button>
      <button class="icon-btn" id="theme-t" title="Switch theme" aria-label="Switch theme">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.6a6.4 6.4 0 100 12.8A5 5 0 018 1.6z" fill="currentColor"/></svg>
      </button>
    </div>
  </aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="overlay"></div>

<script>
(function(){
"use strict";

/* ============ constants ============ */
var PRIO = [
  {id:"critical", label:"Critical", cls:"crit", rank:0},
  {id:"high",     label:"High",     cls:"high", rank:1},
  {id:"medium",   label:"Medium",   cls:"med",  rank:2},
  {id:"low",      label:"Low",      cls:"low",  rank:3}
];
var STATUS = [
  {id:"not_started",    label:"Not started"},
  {id:"in_progress",    label:"In progress"},
  {id:"waiting",        label:"Waiting"},
  {id:"blocked",        label:"Blocked"},
  {id:"needs_approval", label:"Needs approval"},
  {id:"completed",      label:"Completed"},
  {id:"cancelled",      label:"Cancelled"}
];
var DEPTS = {
  "Marketing":["Google Ads","Meta Ads","Email Marketing","UGC","Content","Influencers","Promotions"],
  "Website":["CRO","Shopify","Product Pages","Technical","Tracking","Apps","Development"],
  "Products":["New Products","Samples","Photography","Packaging","Product Copy","Pricing","Product Launches"],
  "Operations":["UK Warehouse","EU Warehouse","US Warehouse","Stock","Fulfilment","Shipping","Suppliers"],
  "Customer Service":["Complaints","Returns","Replacements","Reviews","Delivery Issues","Escalations"],
  "Finance":["Payments","Accounting","VAT","Sales Tax","Profitability","Payment Providers"],
  "Management":["Strategy","Staff","Meetings","Legal","Business Development"]
};
var RECUR = [
  {id:"", label:"Does not repeat"},
  {id:"daily", label:"Every weekday"},
  {id:"weekly", label:"Weekly"},
  {id:"fortnightly", label:"Every 2 weeks"},
  {id:"monthly", label:"Monthly"},
  {id:"quarterly", label:"Quarterly"}
];
var DEFAULT_COLOR = "#1F4B99";
var STOCK_LOCS = [
  {id:"uk_office", label:"UK — Office"},
  {id:"uk_storage", label:"UK — Storage"},
  {id:"eu", label:"EU — 99 Kero"},
  {id:"us", label:"US — Venlo"}
];

/* ============ dates ============ */
function pad(n){return (n<10?"0":"")+n;}
function toISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseISO(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
var TODAY = toISO(new Date());
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return toISO(d);}
function addMonths(s,n){var d=parseISO(s);var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);
  var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return toISO(d);}
function nextWeekday(s){var d=parseISO(s);do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6);return toISO(d);}
function weekStart(s){var d=parseISO(s);var off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return toISO(d);}
var WEEK_START = weekStart(TODAY), WEEK_END = addDays(WEEK_START,6);
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function fmtDate(s){
  if(!s) return "";
  if(s===TODAY) return "Today";
  if(s===addDays(TODAY,1)) return "Tomorrow";
  if(s===addDays(TODAY,-1)) return "Yesterday";
  var d=parseISO(s);
  var y=d.getFullYear()!==parseISO(TODAY).getFullYear()?" "+String(d.getFullYear()).slice(2):"";
  return d.getDate()+" "+MONTHS[d.getMonth()]+y;
}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}

/* ============ helpers ============ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function by(k){return function(a,b){return a[k]<b[k]?-1:a[k]>b[k]?1:0;};}
function initials(n){var p=String(n||"?").trim().split(/\s+/);
  return (p[0]?p[0][0]:"?").toUpperCase()+(p[1]?p[1][0].toUpperCase():"");}
function prio(id){for(var i=0;i<PRIO.length;i++) if(PRIO[i].id===id) return PRIO[i];return PRIO[2];}
function statusLabel(id){for(var i=0;i<STATUS.length;i++) if(STATUS[i].id===id) return STATUS[i].label;return id;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

var OPEN = {not_started:1,in_progress:1,waiting:1,blocked:1,needs_approval:1};
function isOpen(t){return !!OPEN[t.status];}
function isDone(t){return t.status==="completed";}
function isOverdue(t){return isOpen(t)&&!!t.dueDate&&t.dueDate<TODAY;}
function isDueToday(t){return isOpen(t)&&t.dueDate===TODAY;}
function inThisWeek(t){return isOpen(t)&&!!t.dueDate&&t.dueDate>=WEEK_START&&t.dueDate<=WEEK_END;}
function taskProgress(t){
  if(isDone(t)) return 100;
  if(t.subtasks&&t.subtasks.length){
    var d=0;for(var i=0;i<t.subtasks.length;i++) if(t.subtasks[i].done) d++;
    return Math.round(d/t.subtasks.length*100);
  }
  return t.progress||0;
}
function sortTasks(list){
  return list.slice().sort(function(a,b){
    var ao=isOverdue(a)?0:1, bo=isOverdue(b)?0:1;
    if(ao!==bo) return ao-bo;
    var ad=a.dueDate||"9999-99-99", bd=b.dueDate||"9999-99-99";
    if(ad!==bd) return ad<bd?-1:1;
    return prio(a.priority).rank-prio(b.priority).rank;
  });
}

/* ============ state ============ */
var S = {
  db:null, ready:false, writable:true,
  staff:[], projects:[], tasks:[], stock:[],
  view: lsGet("jwl.view")||"dashboard",
  me: lsGet("jwl.me")||null,
  openTask:null, modal:null, focusProject:null, focusStaff:null,
  filters:{q:"",assignee:"",project:"",dept:"",status:"open",priority:""},
  calMode: lsGet("jwl.cal.mode")||"month", calDate: TODAY, calColor:"priority",
  calF:{assignee:"",project:"",dept:""},
  stockF:{q:"",type:""}
};
function staffById(id){for(var i=0;i<S.staff.length;i++) if(S.staff[i].id===id) return S.staff[i];return null;}
function staffName(id){var s=staffById(id);return s?s.name:"Unassigned";}
function staffColor(id){var s=staffById(id);return s&&s.color?s.color:"#7A8090";}
function projectById(id){for(var i=0;i<S.projects.length;i++) if(S.projects[i].id===id) return S.projects[i];return null;}
function projectName(id){var p=projectById(id);return p?p.name:"";}
function liveTasks(){return S.tasks.filter(function(t){return !t.inbox&&t.status!=="cancelled";});}
function inboxTasks(){return S.tasks.filter(function(t){return !!t.inbox;});}

/* ============ project maths ============ */
function projectStats(pid){
  var list = S.tasks.filter(function(t){return t.projectId===pid&&!t.inbox&&t.status!=="cancelled";});
  var total=list.length, done=0, overdue=0, blocked=0, waiting=0, sum=0;
  list.forEach(function(t){
    if(isDone(t)) done++;
    if(isOverdue(t)) overdue++;
    if(t.status==="blocked") blocked++;
    if(t.status==="waiting") waiting++;
    sum += taskProgress(t);
  });
  var pct = total? Math.round(sum/total) : 0;
  return {total:total,done:done,overdue:overdue,blocked:blocked,waiting:waiting,pct:pct,tasks:list};
}
function projectHealth(p){
  var st = projectStats(p.id);
  if(!st.total) return {level:"warn",label:"Not started",reason:"No tasks have been added to this project yet.",stats:st};
  if(st.done===st.total) return {level:"good",label:"Complete",reason:"All "+st.total+" tasks are done.",stats:st};
  var left = p.deadline? daysBetween(TODAY,p.deadline) : null;
  var why=[];
  if(st.overdue) why.push(st.overdue+" task"+(st.overdue>1?"s are":" is")+" overdue");
  if(st.blocked) why.push(st.blocked+" blocked");
  if(left!==null&&left<0) why.push("deadline passed "+Math.abs(left)+" day"+(Math.abs(left)>1?"s":"")+" ago");
  else if(left!==null&&left<=7) why.push("deadline in "+left+" day"+(left===1?"":"s")+" at "+st.pct+"%");
  var bad = st.overdue>=3 || (left!==null&&left<0) || (left!==null&&left<=7&&st.pct<60);
  var warn = st.overdue>=1 || st.blocked>=1 || (left!==null&&left<=14&&st.pct<50);
  if(bad) return {level:"bad",label:"Behind",reason:why.join(", ")+".",stats:st};
  if(warn) return {level:"warn",label:"Attention needed",reason:(why.length?why.join(", ")+".":"Some tasks are slipping."),stats:st};
  return {level:"good",label:"On track",reason:st.done+" of "+st.total+" tasks complete, nothing overdue.",stats:st};
}
function workload(sid){
  var open=0, overdue=0, week=0, today=0, crit=0, doneWeek=0;
  S.tasks.forEach(function(t){
    if(t.assignee!==sid||t.inbox||t.status==="cancelled") return;
    if(isDone(t)){ if(t.completedAt&&t.completedAt>=WEEK_START) doneWeek++; return; }
    open++;
    if(isOverdue(t)) overdue++;
    if(isDueToday(t)) today++;
    if(inThisWeek(t)) week++;
    if(t.priority==="critical"||t.priority==="high") crit++;
  });
  var score = week + overdue*2 + Math.round(crit*0.5);
  var band = score>=16? {label:"Very high",cls:"h-bad"} : score>=9? {label:"High",cls:"h-warn"} : {label:"Normal",cls:"h-good"};
  return {open:open,overdue:overdue,week:week,today:today,crit:crit,doneWeek:doneWeek,score:score,band:band,
          pct:Math.min(100,Math.round(score/20*100))};
}

/* ============ persistence ============ */
function writeDoc(coll,id,data){
  if(!S.db){ return Promise.resolve(); }
  return S.db.doc(coll+"/"+id).set(data).catch(function(e){
    if(e&&e.code==="invalid_argument"){ S.writable=false; render(); }
    console.warn("write failed",e);
  });
}
function deleteDoc(coll,id){
  if(!S.db) return Promise.resolve();
  return S.db.doc(coll+"/"+id).delete().catch(function(e){console.warn("delete failed",e);});
}
function upsertTask(t){
  var i=-1; for(var k=0;k<S.tasks.length;k++) if(S.tasks[k].id===t.id){i=k;break;}
  if(i>=0) S.tasks[i]=t; else S.tasks.push(t);
  var body={}; for(var key in t) if(key!=="id") body[key]=t[key];
  writeDoc("tasks",t.id,body);
  render();
}
function removeTask(id){
  S.tasks = S.tasks.filter(function(t){return t.id!==id;});
  deleteDoc("tasks",id);
  render();
}
function newTask(over){
  var t={id:uid(),title:"",assignee:"",projectId:"",department:"",category:"",
    priority:"medium",status:"not_started",startDate:"",dueDate:"",progress:0,notes:"",
    waitingOn:"",waitingReason:"",waitingExpected:"",blockedReason:"",recurrence:"",recurrenceDay:"",
    subtasks:[],inbox:false,createdAt:TODAY,completedAt:""};
  for(var k in (over||{})) t[k]=over[k];
  return t;
}
function ordinal(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function recurDayFieldHTML(prefix,recurrence,recurrenceDay,dueDate){
  if(recurrence==="weekly"||recurrence==="fortnightly"){
    var dow = (recurrenceDay!=null && recurrenceDay!=="")? +recurrenceDay : parseISO(dueDate||TODAY).getDay();
    return '<div class="field"><label for="'+prefix+'-recur-day">Repeat on</label><select id="'+prefix+'-recur-day">'+
      DAYS.map(function(d,i){return '<option value="'+i+'"'+(i===dow?' selected':'')+'>'+d+'</option>';}).join("")+
      '</select></div>';
  }
  if(recurrence==="monthly"||recurrence==="quarterly"){
    var dom = (recurrenceDay!=null && recurrenceDay!=="")? String(recurrenceDay) : String(parseISO(dueDate||TODAY).getDate());
    var domOpts = '<option value="last"'+(dom==="last"?" selected":"")+'>Last day of the month</option>';
    for(var di=1;di<=31;di++) domOpts += '<option value="'+di+'"'+(String(di)===dom?" selected":"")+'>'+ordinal(di)+'</option>';
    return '<div class="field"><label for="'+prefix+'-recur-day">Repeat on</label><select id="'+prefix+'-recur-day">'+domOpts+'</select></div>';
  }
  return "";
}
function stockById(id){for(var i=0;i<S.stock.length;i++) if(S.stock[i].id===id) return S.stock[i];return null;}
function cloneQty(q){var c={};for(var k in (q||{})) c[k]=q[k];return c;}
function cloneStock(p){var c={};for(var k in p) c[k]= (k==="qty")? cloneQty(p.qty) : p[k];return c;}
function stockTotal(p){var q=p.qty||{},t=0;for(var i=0;i<STOCK_LOCS.length;i++){var v=parseFloat(q[STOCK_LOCS[i].id]);if(!isNaN(v))t+=v;}return t;}
function newStock(over){
  var p={id:uid(),name:"",type:"",qty:{},notes:"",createdAt:TODAY};
  for(var k in (over||{})) p[k]=over[k];
  return p;
}
function stockTypes(){
  var set={}, out=[];
  S.stock.forEach(function(p){ if(p.type && !set[p.type]){ set[p.type]=1; out.push(p.type); } });
  return out.sort();
}
function filteredStock(){
  var f=S.stockF||{q:"",type:""};
  var list=S.stock.slice();
  if(f.type) list=list.filter(function(p){return (p.type||"")===f.type;});
  if(f.q){ var q=f.q.toLowerCase(); list=list.filter(function(p){return (p.name||"").toLowerCase().indexOf(q)>=0;}); }
  return list.sort(by("name"));
}
function csvEscape(v){
  v = String(v==null?"":v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function stockToCSV(list){
  var header = ["Product","Type"].concat(STOCK_LOCS.map(function(l){return l.label;})).concat(["Total"]);
  var rows = list.map(function(p){
    return [p.name||"", p.type||""].concat(STOCK_LOCS.map(function(l){return (p.qty||{})[l.id]||0;})).concat([stockTotal(p)]);
  });
  return [header].concat(rows).map(function(r){return r.map(csvEscape).join(",");}).join("\r\n");
}
function downloadTextFile(filename, content, mime){
  var blob = new Blob([content], {type:(mime||"text/plain")+";charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function upsertStock(p){
  var i=-1; for(var k=0;k<S.stock.length;k++) if(S.stock[k].id===p.id){i=k;break;}
  if(i>=0) S.stock[i]=p; else S.stock.push(p);
  var body={}; for(var key in p) if(key!=="id") body[key]=p[key];
  writeDoc("stock",p.id,body);
  render();
}
function removeStock(id){
  S.stock = S.stock.filter(function(p){return p.id!==id;});
  deleteDoc("stock",id);
  render();
}
function completeTask(t){
  var copy={}; for(var k in t) copy[k]=t[k];
  if(isDone(t)){
    copy.status="in_progress"; copy.completedAt="";
    if(copy.subtasks&&copy.subtasks.length) copy.subtasks=copy.subtasks.map(function(s){return {id:s.id,title:s.title,done:false};});
    upsertTask(copy); return;
  }
  copy.status="completed"; copy.completedAt=TODAY; copy.progress=100;
  if(copy.subtasks&&copy.subtasks.length) copy.subtasks=copy.subtasks.map(function(s){return {id:s.id,title:s.title,done:true};});
  upsertTask(copy);
  if(t.recurrence) spawnNext(t);
}
function nextByWeekday(base,stepDays,recurrenceDay){
  var next = addDays(base,stepDays);
  if(recurrenceDay!=null && recurrenceDay!==""){
    var target=+recurrenceDay;
    if(parseISO(next).getDay()!==target){
      var d=parseISO(base); d.setDate(d.getDate()+1);
      while(d.getDay()!==target) d.setDate(d.getDate()+1);
      next=toISO(d);
    }
  }
  return next;
}
function lastDayOfMonth(iso){
  var d=parseISO(iso);
  return toISO(new Date(d.getFullYear(), d.getMonth()+1, 0));
}
function nextByMonthDay(base,stepMonths,recurrenceDay){
  var next = addMonths(base,stepMonths);
  if(recurrenceDay==="last"){
    next = lastDayOfMonth(next);
  } else if(recurrenceDay!=null && recurrenceDay!==""){
    var day=+recurrenceDay;
    var d=parseISO(next); d.setDate(1);
    var last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day,last));
    next=toISO(d);
  }
  return next;
}
function spawnNext(t){
  var base = t.dueDate||TODAY, next, rd=t.recurrenceDay;
  if(t.recurrence==="daily") next = nextWeekday(base<TODAY?TODAY:base);
  else if(t.recurrence==="weekly") next = nextByWeekday(base,7,rd);
  else if(t.recurrence==="fortnightly") next = nextByWeekday(base,14,rd);
  else if(t.recurrence==="monthly") next = nextByMonthDay(base,1,rd);
  else if(t.recurrence==="quarterly") next = nextByMonthDay(base,3,rd);
  else return;
  while(next<TODAY) next = t.recurrence==="daily"? nextWeekday(next)
    : t.recurrence==="weekly"? nextByWeekday(next,7,rd)
    : t.recurrence==="fortnightly"? nextByWeekday(next,14,rd)
    : t.recurrence==="monthly"? nextByMonthDay(next,1,rd) : nextByMonthDay(next,3,rd);
  var n = newTask({
    title:t.title, assignee:t.assignee, projectId:t.projectId, department:t.department,
    category:t.category, priority:t.priority, dueDate:next, notes:t.notes,
    recurrence:t.recurrence, recurrenceDay:t.recurrenceDay||"",
    subtasks:(t.subtasks||[]).map(function(s){return {id:uid(),title:s.title,done:false};})
  });
  upsertTask(n);
}

/* ============ rendering: components ============ */
function priorityPill(p){var o=prio(p);return '<span class="pill '+o.cls+'"><span class="pdot" style="background:currentColor"></span>'+o.label+'</span>';}
function avatar(sid){
  var s=staffById(sid);

function dueChip(t){
  if(!t.dueDate) return '';
  var cls = isOverdue(t)?"due over":(isDueToday(t)?"due today":"due");
  var label = fmtDate(t.dueDate);
  if(isOverdue(t)){ var d=daysBetween(t.dueDate,TODAY); label = d+"d overdue"; }
  return '<span class="'+cls+'">'+esc(label)+'</span>';
}
function taskRow(t,opts){
  opts=opts||{};
  var p = prio(t.priority);
  var pj = projectById(t.projectId);
  var meta=[];
  if(!opts.hideOwner) meta.push('<span>'+esc(staffName(t.assignee))+'</span>');
  if(t.dueDate) meta.push(dueChip(t));
  if(pj&&!opts.hideProject) meta.push('<span class="pill flat"><span class="pdot" style="background:'+esc(pj.color||DEFAULT_COLOR)+'"></span>'+esc(pj.name)+'</span>');
  if(t.status==="waiting") meta.push('<span class="pill flat">Waiting'+(t.waitingOn?" · "+esc(t.waitingOn):"")+'</span>');
  if(t.status==="blocked") meta.push('<span class="pill crit">Blocked</span>');
  if(t.status==="needs_approval") meta.push('<span class="pill high">Needs approval</span>');
  if(t.recurrence) meta.push('<span class="pill flat">↻ '+esc((RECUR.filter(function(r){return r.id===t.recurrence;})[0]||{label:""}).label)+'</span>');
  if(t.subtasks&&t.subtasks.length){
    var d=0;t.subtasks.forEach(function(s){if(s.done)d++;});
    meta.push('<span>'+d+'/'+t.subtasks.length+' subtasks</span>');
  }
  return '<div class="trow'+(isDone(t)?' done':'')+'" data-task="'+esc(t.id)+'">'+
    '<span class="pbar" style="background:var(--'+p.cls+')"></span>'+
    '<button class="tick" data-tick="'+esc(t.id)+'" aria-label="'+(isDone(t)?'Reopen':'Complete')+' '+esc(t.title)+'">'+
      '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1.5 6.2l3 3 6-6.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '</button>'+
    '<button class="tbody" data-open="'+esc(t.id)+'" style="text-align:left;background:none">'+
      '<div class="ttitle">'+esc(t.title)+'</div>'+
      (meta.length?'<div class="tmeta">'+meta.join("")+'</div>':'')+
    '</button>'+
  '</div>';
}
function taskList(list,opts,emptyMsg){
  if(!list.length) return '<div class="empty">'+esc(emptyMsg||"Nothing here.")+'</div>';
  return '<div class="tlist">'+list.map(function(t){return taskRow(t,opts);}).join("")+'</div>';
}
function section(cls,title,list,opts,emptyMsg){
  return '<div class="sect-h '+cls+'"><span class="t">'+esc(title)+'</span><span class="c">'+list.length+'</span></div>'+
    (list.length? taskList(list,opts) : '<div class="empty">'+esc(emptyMsg||"Clear.")+'</div>');

function healthClass(level){return level==="good"?"tl-good":level==="warn"?"tl-warn":"tl-bad";}

function avatarsForProject(pid){
  var seen={}, ids=[];
  S.tasks.forEach(function(t){

  });
  var shown=ids.slice(0,4);
  var html='<span class="stack-avatars">'+shown.map(avatar).join("");
  if(ids.length>shown.length) html+='<span class="avatar" style="background:var(--ink-3)">+'+(ids.length-shown.length)+'</span>';
  html+='</span>';
  return html;

function viewDashboard(){
  var live = liveTasks();

  var overdue = live.filter(isOverdue);

  var waiting = live.filter(function(t){return t.status==="waiting";});
  var blocked = live.filter(function(t){return t.status==="blocked";});
  var approvals = live.filter(function(t){return t.status==="needs_approval";});

    (mine.length? mine.map(actionRow).join("") : '<div class="empty">'+(S.me? "Nothing due for you this week." : "Pick who you are to see your actions.")+'</div>')+'</div>';

  html += '<div class="panel"><div class="panel-h"><h2>Upcoming, next 7 days</h2></div>'+

        '<div class="ttitle">'+esc(t.title)+'</div><div class="tmeta">'+
        (t.waitingOn?'<span class="pill flat">'+esc(t.waitingOn)+'</span>':'')+
        (t.waitingExpected?'<span>Expected '+esc(fmtDate(t.waitingExpected))+'</span>':'')+
        '<span>'+esc(staffName(t.assignee))+'</span></div></button></div>';

  if(blocked.length){
    html += '<div class="panel"><div class="panel-h"><h2>Blocked</h2><span class="prj-pct">'+blocked.length+'</span></div>'+

          '</button></div>';
      }).join("")+'</div></div>';

    html += '<div class="panel"><div class="panel-h"><h2>Needs approval</h2><span class="prj-pct">'+approvals.length+'</span></div>'+
      taskList(approvals,{})+'</div>';
  }

  if(atRisk.length){
    html += '<div class="panel"><div class="panel-h"><h2>Why they need attention</h2></div><div class="tlist">'+
      atRisk.map(function(p){var h=projectHealth(p);

function viewMyDay(){
  if(!S.me) return '<div class="page-head"><h1>My day</h1></div><div class="panel"><div class="empty">Choose who you are at the top left to see your day.</div></div>';
  var s = staffById(S.me);
  var mine = liveTasks().filter(function(t){return t.assignee===S.me;});
  var overdue = sortTasks(mine.filter(isOverdue));
  var mustDo = sortTasks(mine.filter(function(t){return isDueToday(t)&&(t.priority==="critical"||t.priority==="high");}));
  var todayRest = sortTasks(mine.filter(function(t){return isDueToday(t)&&t.priority!=="critical"&&t.priority!=="high";}));
  var waiting = sortTasks(mine.filter(function(t){return t.status==="waiting"||t.status==="blocked";}));
  var ifTime = sortTasks(mine.filter(function(t){return isOpen(t)&&t.status!=="waiting"&&t.status!=="blocked"&&!isDueToday(t)&&!isOverdue(t)&&inThisWeek(t);}));
  var later = sortTasks(mine.filter(function(t){return isOpen(t)&&t.status!=="waiting"&&t.status!=="blocked"&&!isDueToday(t)&&!isOverdue(t)&&!inThisWeek(t);}));
  var doneToday = mine.filter(function(t){return isDone(t)&&t.completedAt===TODAY;});

  var d=parseISO(TODAY);

  '</div>';
  h += '<div class="panel">';
  h += section("over","Overdue",overdue,{hideOwner:true},"Nothing overdue. Good.");
  h += section("must","Must do today",mustDo,{hideOwner:true},"No critical or high-priority tasks due today.");
  h += section("","Also due today",todayRest,{hideOwner:true},"Nothing else due today.");
  h += section("wait","Waiting or blocked",waiting,{hideOwner:true},"Nothing held up.");
  h += section("","If time allows",ifTime,{hideOwner:true},"Nothing else this week.");
  h += section("","Later — everything else on your plate",later,{hideOwner:true},"Nothing else assigned to you.");
  h += '</div>';
  if(doneToday.length){
    h += '<div style="height:16px"></div><div class="panel"><div class="panel-h"><h2>Completed today</h2></div>'+taskList(doneToday,{hideOwner:true})+'</div>';
  }
  return h;
}

function viewTasks(){
  var f=S.filters;
  var list = S.tasks.filter(function(t){return !t.inbox;});
  if(f.status==="open") list=list.filter(isOpen);
  else if(f.status==="done") list=list.filter(isDone);
  else if(f.status==="overdue") list=list.filter(isOverdue);
  else if(f.status&&f.status!=="all") list=list.filter(function(t){return t.status===f.status;});
  if(f.assignee) list=list.filter(function(t){return t.assignee===f.assignee;});
  if(f.project) list=list.filter(function(t){return t.projectId===f.project;});
  if(f.dept) list=list.filter(function(t){return t.department===f.dept;});
  if(f.priority) list=list.filter(function(t){return t.priority===f.priority;});
  if(f.q){var q=f.q.toLowerCase();
    list=list.filter(function(t){return (t.title+" "+(t.notes||"")+" "+(t.category||"")+" "+projectName(t.projectId)).toLowerCase().indexOf(q)>=0;});}
  list = sortTasks(list);

  var h='<div class="page-head"><div><div class="eyebrow">'+list.length+' task'+(list.length===1?'':'s')+'</div><h1>Tasks</h1></div></div>';
  h+='<div class="bar">'+
    '<input type="search" id="f-q" placeholder="Search tasks…" value="'+esc(f.q)+'">'+
    sel("f-status",[{id:"open",label:"Open"},{id:"overdue",label:"Overdue"},{id:"done",label:"Completed"},{id:"all",label:"All statuses"}].concat(STATUS.map(function(s){return {id:s.id,label:s.label};})),f.status,null)+
    sel("f-assignee",S.staff.map(function(s){return {id:s.id,label:s.name};}),f.assignee,"Everyone")+
    sel("f-project",S.projects.map(function(p){return {id:p.id,label:p.name};}),f.project,"All projects")+
    sel("f-dept",Object.keys(DEPTS).map(function(d){return {id:d,label:d};}),f.dept,"All departments")+
    sel("f-priority",PRIO.map(function(p){return {id:p.id,label:p.label};}),f.priority,"Any priority")+
    '<button class="chip" id="f-clear">Clear</button>'+
  '</div>';
  h+='<div class="panel">'+taskList(list,{},"No tasks match these filters.")+'</div>';
  return h;
}
function sel(id,opts,value,placeholder){
  var o = (placeholder!=null? '<option value="">'+esc(placeholder)+'</option>' : '');
  o += opts.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===value?' selected':'')+'>'+esc(x.label)+'</option>';}).join("");
  return '<select id="'+id+'">'+o+'</select>';
}

/* ============ calendar ============ */
function deptColor(name){
  var pal=["#1F4B99","#A6172B","#1F7A4D","#C98A19","#6B4A9E","#C2447C","#4FA6B8"];
  var i=Object.keys(DEPTS).indexOf(name);
  return pal[i>=0?i%pal.length:pal.length-1];
}
function calColorFor(t){
  if(S.calColor==="staff") return staffColor(t.assignee);
  if(S.calColor==="project"){ var p=projectById(t.projectId); return p?(p.color||DEFAULT_COLOR):"#9AA0AC"; }
  if(S.calColor==="dept") return t.department?deptColor(t.department):"#9AA0AC";
  return "var(--"+prio(t.priority).cls+")";
}
function calFilteredTasks(){
  var f=S.calF;
  var list = S.tasks.filter(function(t){return !t.inbox&&t.status!=="cancelled"&&!!t.dueDate;});
  if(f.assignee==="__me__") list=list.filter(function(t){return t.assignee===S.me;});
  else if(f.assignee) list=list.filter(function(t){return t.assignee===f.assignee;});
  if(f.project) list=list.filter(function(t){return t.projectId===f.project;});
  if(f.dept) list=list.filter(function(t){return t.department===f.dept;});
  return list;
}
function calTasksByDate(list){
  var m={};
  list.forEach(function(t){ (m[t.dueDate]=m[t.dueDate]||[]).push(t); });
  Object.keys(m).forEach(function(k){ m[k]=sortTasks(m[k]); });
  return m;
}
function calChip(t){
  return '<button class="cal-chip'+(isDone(t)?' done':'')+'" draggable="true" data-caldrag="'+esc(t.id)+'" data-open="'+esc(t.id)+'" title="'+esc(t.title)+'">'+
    '<span class="dot" style="background:'+calColorFor(t)+'"></span><span>'+esc(t.title)+'</span></button>';
}
function calToolbar(){
  var label;
  if(S.calMode==="month"){ var d=parseISO(S.calDate); label=MONTHS[d.getMonth()]+" "+d.getFullYear(); }
  else if(S.calMode==="week"){ var ws=weekStart(S.calDate); label=fmtDate(ws)+" – "+fmtDate(addDays(ws,6)); }
  else { label=fmtDate(S.calDate); }
  function modeChip(id,lab){ return '<button class="chip" data-cal-mode="'+id+'" aria-pressed="'+(S.calMode===id)+'">'+lab+'</button>'; }
  return '<div class="cal-toolbar">'+
    '<div class="cal-nav">'+
      '<button data-cal-nav="prev" aria-label="Previous">‹</button>'+
      '<button class="btn" data-cal-nav="today" style="padding:6px 11px">Today</button>'+
      '<button data-cal-nav="next" aria-label="Next">›</button>'+
    '</div>'+
    '<span class="cal-label">'+esc(label)+'</span>'+
    '<div class="cal-modes">'+modeChip("day","Day")+modeChip("week","Week")+modeChip("month","Month")+'</div>'+
  '</div>'+
  '<div class="bar">'+
    sel("cf-assignee",[{id:"__me__",label:"My tasks"}].concat(S.staff.map(function(s){return{id:s.id,label:s.name};})),S.calF.assignee,"All staff")+
    sel("cf-project",S.projects.map(function(p){return{id:p.id,label:p.name};}),S.calF.project,"All projects")+
    sel("cf-dept",Object.keys(DEPTS).map(function(d){return{id:d,label:d};}),S.calF.dept,"All departments")+
    sel("cf-color",[{id:"priority",label:"Colour: priority"},{id:"staff",label:"Colour: staff"},{id:"project",label:"Colour: project"},{id:"dept",label:"Colour: department"}],S.calColor,null)+
  '</div>';
}
function calMonthGrid(){
  var byDate = calTasksByDate(calFilteredTasks());
  var first = parseISO(S.calDate); first.setDate(1);
  var firstISO = toISO(first);
  var lastISO = toISO(new Date(first.getFullYear(), first.getMonth()+1, 0));
  var gridStart = weekStart(firstISO), gridEnd = addDays(weekStart(lastISO),6);
  var head = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(d){return '<div class="cal-daylabel">'+d+'</div>';}).join("");
  var body="", cur=gridStart;
  while(cur<=gridEnd){
    var d=parseISO(cur), inMonth=d.getMonth()===first.getMonth();
    var dayTasks=byDate[cur]||[], shown=dayTasks.slice(0,4), more=dayTasks.length-shown.length;
    body += '<div class="cal-cell'+(inMonth?'':' other-month')+(cur===TODAY?' is-today':'')+'" data-caldrop="'+cur+'">'+
      '<span class="cal-daynum">'+d.getDate()+'</span>'+
      '<div class="cal-chips">'+shown.map(calChip).join("")+
      (more>0?'<button class="cal-more" data-cal-day="'+cur+'">+'+more+' more</button>':'')+
      '</div></div>';
    cur = addDays(cur,1);
  }
  return '<div class="cal-grid">'+head+body+'</div>';
}
function calWeekGrid(){
  var byDate = calTasksByDate(calFilteredTasks());
  var ws = weekStart(S.calDate);
  var head="", body="";
  var labels=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  for(var i=0;i<7;i++){
    var iso=addDays(ws,i), d=parseISO(iso);
    head += '<div class="cal-daylabel">'+labels[i]+' '+d.getDate()+'</div>';
    var dayTasks = byDate[iso]||[];
    body += '<div class="cal-cell'+(iso===TODAY?' is-today':'')+'" data-caldrop="'+iso+'">'+
      '<div class="cal-chips">'+(dayTasks.length?dayTasks.map(calChip).join(""):'')+'</div></div>';
  }
  return '<div class="cal-grid cal-week">'+head+body+'</div>';
}
function calDayView(){
  var list = sortTasks(calFilteredTasks().filter(function(t){return t.dueDate===S.calDate;}));
  return '<div class="panel cal-day-list">'+taskList(list,{},"Nothing due this day.")+'</div>';
}
function viewCalendar(){
  var h = '<div class="page-head"><div><div class="eyebrow">Calendar</div><h1>Calendar</h1></div></div>';
  h += calToolbar();
  if(S.calMode==="month") h += calMonthGrid();
  else if(S.calMode==="week") h += calWeekGrid();
  else h += calDayView();
  return h;
}

/* ============ events ============ */
function closeOverlay(){ S.modal=null; S.modalProject=null; S.modalPrefill=null; S.modalStock=null; S.openTask=null; renderOverlay(); }
function go(v){
  if(v!=="projects") S.focusProject=null;
  if(v!=="team") S.focusStaff=null;
  S.view=v; lsSet("jwl.view",v);
  var m=document.getElementById("main"); if(m) m.scrollTop=0;
  render();
}
function val(id){var e=document.getElementById(id);return e?e.value:"";}
function findTask(id){for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id===id) return S.tasks[i];return null;}

document.addEventListener("click",function(ev){
  var el, t;

  if(ev.target.classList && ev.target.classList.contains("scrim")){ closeOverlay(); return; }
  if(ev.target.closest("button[data-close]")){ closeOverlay(); return; }

  el = ev.target.closest("[data-go]");
  if(el){ go(el.getAttribute("data-go")); return; }

  el = ev.target.closest("[data-tick]");
  if(el){ t=findTask(el.getAttribute("data-tick")); if(t) completeTask(t); return; }

  el = ev.target.closest("[data-organise]");
  if(el){ var oid=el.getAttribute("data-organise"); S.openTask=oid; renderOverlay(); return; }

  el = ev.target.closest("[data-open]");
  if(el){ S.openTask=el.getAttribute("data-open"); renderOverlay(); return; }

  el = ev.target.closest("[data-project]");
  if(el){ S.focusProject=el.getAttribute("data-project"); S.view="projects"; lsSet("jwl.view","projects"); render(); return; }

  el = ev.target.closest("[data-staff]");
  if(el){ S.focusStaff=el.getAttribute("data-staff"); S.view="team"; lsSet("jwl.view","team"); render(); return; }

  el = ev.target.closest("[data-cal-mode]");
  if(el){ S.calMode=el.getAttribute("data-cal-mode"); lsSet("jwl.cal.mode",S.calMode); render(); return; }

  el = ev.target.closest("[data-cal-nav]");
  if(el){ var dir=el.getAttribute("data-cal-nav");
    if(dir==="today") S.calDate=TODAY;
    else if(S.calMode==="month") S.calDate=addMonths(S.calDate,dir==="prev"?-1:1);
    else if(S.calMode==="week") S.calDate=addDays(S.calDate,dir==="prev"?-7:7);
    else S.calDate=addDays(S.calDate,dir==="prev"?-1:1);
    render(); return; }

  el = ev.target.closest("[data-cal-day]");
  if(el){ S.calDate=el.getAttribute("data-cal-day"); S.calMode="day"; lsSet("jwl.cal.mode","day"); render(); return; }

  el = ev.target.closest("[data-editproject]");
  if(el){ S.modalProject=projectById(el.getAttribute("data-editproject")); S.modal="project"; renderOverlay(); return; }

  el = ev.target.closest("[data-newtask-project]");
  if(el){ S.modalPrefill={projectId:el.getAttribute("data-newtask-project")}; S.modal="quickadd"; renderOverlay(); return; }

  el = ev.target.closest("[data-newtask-stock]");
  if(el){ var sp=stockById(el.getAttribute("data-newtask-stock"));
    S.modalPrefill={title: sp? "Fill "+sp.name : "Fill stock", department:"Operations"};
    S.modal="quickadd"; renderOverlay(); return; }

  el = ev.target.closest("[data-delstock]");
  if(el){ removeStock(el.getAttribute("data-delstock")); return; }

  el = ev.target.closest("[data-editstock]");
  if(el){ S.modalStock=stockById(el.getAttribute("data-editstock")); S.modal="stock"; renderOverlay(); return; }

  if(ev.target.closest("#quick-add")){ S.modalPrefill=null; S.modal="quickadd"; renderOverlay(); return; }
  if(ev.target.closest("#new-project")){ S.modalProject=null; S.modal="project"; renderOverlay(); return; }
  if(ev.target.closest("#new-staff")){ S.modal="staff"; renderOverlay(); return; }
  if(ev.target.closest("#new-stock")){ S.modalStock=null; S.modal="stock"; renderOverlay(); return; }
  if(ev.target.closest("#theme-t")){ toggleTheme(); return; }
  if(ev.target.closest("#f-clear")){ S.filters={q:"",assignee:"",project:"",dept:"",status:"open",priority:""}; render(); return; }
  if(ev.target.closest("#cap-go")){ capture(); return; }
  if(ev.target.closest("#stock-export")){ downloadTextFile("jwl-stock-"+TODAY+".csv", stockToCSV(filteredStock()), "text/csv"); return; }

  el = ev.target.closest(".pm-sw");
  if(el){ document.getElementById("pm-color").value = el.getAttribute("data-color");
    Array.prototype.forEach.call(document.querySelectorAll(".pm-sw"),function(b){b.style.borderColor="transparent";});
    el.style.borderColor="var(--ink)"; return; }
  el = ev.target.closest(".sm-sw");
  if(el){ document.getElementById("sm-color").value = el.getAttribute("data-color");
    Array.prototype.forEach.call(document.querySelectorAll(".sm-sw"),function(b){b.style.borderColor="transparent";});
    el.style.borderColor="var(--ink)"; return; }

  if(ev.target.closest("#qa-save")){ saveQuickAdd(); return; }
  if(ev.target.closest("#pm-save")){ saveProject(); return; }
  if(ev.target.closest("#pm-del")){ deleteProject(); return; }
  if(ev.target.closest("#sm-save")){ saveStaff(); return; }
  if(ev.target.closest("#st-save")){ saveStockProduct(); return; }
  if(ev.target.closest("#st-del")){ deleteStockProduct(); return; }
  if(ev.target.closest("#td-save")){ saveDrawer(); return; }
  if(ev.target.closest("#td-del")){ if(S.openTask){ removeTask(S.openTask); closeOverlay(); } return; }
  if(ev.target.closest("#td-complete")){ t=findTask(S.openTask); if(t){ completeTask(t); renderOverlay(); } return; }
  if(ev.target.closest("#td-subadd")){ addSubtask(); return; }

  el = ev.target.closest("[data-subdel]");
  if(el){ var sid=el.getAttribute("data-subdel"); t=findTask(S.openTask);
    if(t){ var c=cloneTask(t); c.subtasks=(c.subtasks||[]).filter(function(s){return s.id!==sid;}); upsertTask(c); } return; }
});

document.addEventListener("change",function(ev){
  var id=ev.target.id;
  if(id==="me-select"){ S.me=ev.target.value||null; lsSet("jwl.me",S.me||""); render(); return; }
  if(id==="f-status"){ S.filters.status=ev.target.value; render(); return; }
  if(id==="f-assignee"){ S.filters.assignee=ev.target.value; render(); return; }
  if(id==="f-project"){ S.filters.project=ev.target.value; render(); return; }
  if(id==="f-dept"){ S.filters.dept=ev.target.value; render(); return; }
  if(id==="f-priority"){ S.filters.priority=ev.target.value; render(); return; }
  if(id==="cf-assignee"){ S.calF.assignee=ev.target.value; render(); return; }
  if(id==="cf-project"){ S.calF.project=ev.target.value; render(); return; }
  if(id==="cf-dept"){ S.calF.dept=ev.target.value; render(); return; }
  if(id==="cf-color"){ S.calColor=ev.target.value; render(); return; }
  if(id==="sf-type"){ S.stockF.type=ev.target.value; render(); return; }
  if(id==="td-status"||id==="td-dept"||id==="td-recur"){ saveDrawer(true); return; }
  if(id==="qa-recur"){ syncQuickAddPrefill(); renderOverlay(); return; }
  if(ev.target.matches && ev.target.matches("[data-stock]")){
    var pid=ev.target.getAttribute("data-stock"), loc=ev.target.getAttribute("data-loc");
    var p=stockById(pid); if(!p) return;
    var c=cloneStock(p); c.qty=c.qty||{};
    var raw=ev.target.value;
    c.qty[loc] = raw===""? "" : raw;
    upsertStock(c);
    return;
  }
  if(ev.target.matches("[data-sub]")){
    var t=findTask(S.openTask); if(!t) return;
    var sid=ev.target.getAttribute("data-sub");
    var c=cloneTask(t);
    c.subtasks=(c.subtasks||[]).map(function(s){return s.id===sid?{id:s.id,title:s.title,done:!s.done}:s;});
    upsertTask(c); renderOverlay(); return;
  }
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="f-q"){ S.filters.q=ev.target.value;
    clearTimeout(window.__q); window.__q=setTimeout(function(){
      var pos=null, e=document.getElementById("f-q"); if(e) pos=e.selectionStart;
      render();
      var e2=document.getElementById("f-q"); if(e2){ e2.focus(); if(pos!=null) try{e2.setSelectionRange(pos,pos);}catch(x){} }
    },220);
  }
  if(ev.target.id==="sf-q"){ S.stockF.q=ev.target.value;
    clearTimeout(window.__sq); window.__sq=setTimeout(function(){
      var pos=null, e=document.getElementById("sf-q"); if(e) pos=e.selectionStart;
      render();
      var e2=document.getElementById("sf-q"); if(e2){ e2.focus(); if(pos!=null) try{e2.setSelectionRange(pos,pos);}catch(x){} }
    },220);
  }
  if(ev.target.id==="td-progress"){
    var lab=ev.target.parentNode.querySelector("label");
    if(lab) lab.textContent="Progress — "+ev.target.value+"%";
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){ closeOverlay(); return; }
  if(ev.key==="Enter"){
    if(ev.target.id==="qa-title"||ev.target.id==="qa-due"){ saveQuickAdd(); }
    else if(ev.target.id==="cap"){ capture(); }
    else if(ev.target.id==="td-subnew"){ addSubtask(); }
    else if(ev.target.id==="pm-name"){ saveProject(); }
    else if(ev.target.id==="sm-name"||ev.target.id==="sm-role"){ saveStaff(); }
    else if(ev.target.id==="st-name"||ev.target.id==="st-type"){ saveStockProduct(); }
    return;
  }
  if(ev.target.classList && ev.target.classList.contains("stock-qty") && ev.key==="Enter"){ ev.target.blur(); }
  if((ev.key==="n"||ev.key==="N") && !ev.metaKey && !ev.ctrlKey &&
     !/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName) && !S.modal && !S.openTask){
    ev.preventDefault(); S.modalPrefill=null; S.modal="quickadd"; renderOverlay();
  }
});

document.addEventListener("dragstart",function(ev){
  var el=ev.target.closest("[data-caldrag]");
  if(!el) return;
  ev.dataTransfer.setData("text/plain",el.getAttribute("data-caldrag"));
  ev.dataTransfer.effectAllowed="move";
});
document.addEventListener("dragover",function(ev){
  var el=ev.target.closest("[data-caldrop]");
  if(!el) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect="move";
  el.classList.add("drop-hover");
});
document.addEventListener("dragleave",function(ev){
  var el=ev.target.closest("[data-caldrop]");
  if(el) el.classList.remove("drop-hover");
});
document.addEventListener("drop",function(ev){
  var el=ev.target.closest("[data-caldrop]");
  if(!el) return;
  ev.preventDefault();
  el.classList.remove("drop-hover");
  var id=ev.dataTransfer.getData("text/plain");
  var iso=el.getAttribute("data-caldrop");
  var t=findTask(id);
  if(t&&t.dueDate!==iso){ var c=cloneTask(t); c.dueDate=iso; upsertTask(c); }
});

function cloneTask(t){var c={};for(var k in t) c[k]= Array.isArray(t[k])? t[k].map(function(x){var y={};for(var j in x)y[j]=x[j];return y;}) : t[k];return c;}
function capture(){
  var e=document.getElementById("cap"); if(!e) return;
  var v=e.value.trim(); if(!v) return;
  upsertTask(newTask({title:v,inbox:true,priority:"medium"}));
  var e2=document.getElementById("cap"); if(e2){ e2.value=""; e2.focus(); }
}
function syncQuickAddPrefill(){
  S.modalPrefill = {
    title: val("qa-title"), assignee: val("qa-assignee"), dueDate: val("qa-due"),
    priority: val("qa-prio"), projectId: val("qa-project"), department: val("qa-dept"),
    recurrence: val("qa-recur"),
    recurrenceDay: document.getElementById("qa-recur-day")? val("qa-recur-day") : ""
  };
}
function saveQuickAdd(){
  var title=val("qa-title").trim();
  if(!title){ var e=document.getElementById("qa-title"); if(e) e.focus(); return; }
  upsertTask(newTask({
    title:title, assignee:val("qa-assignee"), dueDate:val("qa-due"),
    priority:val("qa-prio")||"medium", projectId:val("qa-project"), department:val("qa-dept"),
    recurrence: val("qa-recur")||"",
    recurrenceDay: document.getElementById("qa-recur-day")? val("qa-recur-day") : ""
  }));
  closeOverlay();
}
function saveProject(){
  var name=val("pm-name").trim();
  if(!name){ var e=document.getElementById("pm-name"); if(e) e.focus(); return; }
  var existing=S.modalProject;
  var p = {
    id: existing? existing.id : uid(),
    name:name, owner:val("pm-owner"), deadline:val("pm-deadline"),
    department:val("pm-dept"), color:val("pm-color")||DEFAULT_COLOR,
    archived: !!(document.getElementById("pm-arch")&&document.getElementById("pm-arch").checked),
    createdAt: existing? existing.createdAt : TODAY
  };
  var i=-1; for(var k=0;k<S.projects.length;k++) if(S.projects[k].id===p.id){i=k;break;}
  if(i>=0) S.projects[i]=p; else S.projects.push(p);
  var body={}; for(var key in p) if(key!=="id") body[key]=p[key];
  writeDoc("projects",p.id,body);
  closeOverlay(); render();
}
function deleteProject(){
  var p=S.modalProject; if(!p) return;
  S.projects=S.projects.filter(function(x){return x.id!==p.id;});
  deleteDoc("projects",p.id);
  S.tasks.forEach(function(t){ if(t.projectId===p.id){ var c=cloneTask(t); c.projectId=""; upsertTask(c); } });
  if(S.focusProject===p.id) S.focusProject=null;
  closeOverlay(); render();
}
function saveStaff(){
  var name=val("sm-name").trim();
  if(!name){ var e=document.getElementById("sm-name"); if(e) e.focus(); return; }
  var s={id:uid(),name:name,role:val("sm-role"),color:val("sm-color")||"#1F4B99",active:true};
  S.staff.push(s);
  var body={}; for(var key in s) if(key!=="id") body[key]=s[key];
  writeDoc("staff",s.id,body);
  closeOverlay(); render();
}
function saveStockProduct(){
  var name=val("st-name").trim();
  if(!name){ var e=document.getElementById("st-name"); if(e) e.focus(); return; }
  var type=val("st-type").trim();
  var existing=S.modalStock;
  if(existing){
    var c=cloneStock(existing); c.name=name; c.type=type;
    upsertStock(c);
  } else {
    upsertStock(newStock({name:name,type:type}));
  }
  closeOverlay();
}
function deleteStockProduct(){
  var p=S.modalStock; if(!p) return;
  removeStock(p.id);
  closeOverlay();
}
function addSubtask(){
  var e=document.getElementById("td-subnew"); if(!e) return;
  var v=e.value.trim(); if(!v) return;
  var t=findTask(S.openTask); if(!t) return;
  var c=cloneTask(t); c.subtasks=(c.subtasks||[]).concat([{id:uid(),title:v,done:false}]);
  upsertTask(c); renderOverlay();
  var e2=document.getElementById("td-subnew"); if(e2) e2.focus();
}
function saveDrawer(keepOpen){
  var t=findTask(S.openTask); if(!t) return;
  var c=cloneTask(t);
  c.title = val("td-title").trim()||c.title;
  c.assignee = val("td-assignee");
  c.projectId = val("td-project");
  var newDept = val("td-dept");
  if(newDept!==c.department){ c.department=newDept; c.category=""; } else { c.category=val("td-cat"); }
  c.priority = val("td-prio");
  var prevStatus=c.status;
  c.status = val("td-status");
  c.startDate = val("td-start");
  c.dueDate = val("td-due");
  c.recurrence = val("td-recur");
  c.recurrenceDay = document.getElementById("td-recur-day")? val("td-recur-day") : "";
  c.notes = val("td-notes");
  if(document.getElementById("td-won")) c.waitingOn=val("td-won");
  if(document.getElementById("td-wexp")) c.waitingExpected=val("td-wexp");
  if(document.getElementById("td-wreason")) c.waitingReason=val("td-wreason");
  if(document.getElementById("td-block")) c.blockedReason=val("td-block");
  var pr=document.getElementById("td-progress");
  if(pr&&!pr.disabled) c.progress=parseInt(pr.value,10)||0;
  if(c.inbox && (c.assignee||c.projectId||c.dueDate)) c.inbox=false;
  if(c.status==="completed"&&prevStatus!=="completed"){ c.completedAt=TODAY; c.progress=100; }
  if(c.status!=="completed") c.completedAt="";
  upsertTask(c);
  if(keepOpen) renderOverlay(); else closeOverlay();
}

/* ============ theme ============ */
function toggleTheme(){
  var r=document.documentElement;
  var cur=r.getAttribute("data-theme");
  var prefersDark = window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next = cur? (cur==="dark"?"light":"dark") : (prefersDark?"light":"dark");
  r.setAttribute("data-theme",next); lsSet("jwl.theme",next);
}
(function(){var s=lsGet("jwl.theme"); if(s) document.documentElement.setAttribute("data-theme",s);})();

/* ============ server-backed db shim ============ */
/* Mimics the {collection(x).onSnapshot(cb,errcb), doc(x).set()/.delete()}
   surface the rest of this file's logic already expects, backed by a
   plain REST API + Server-Sent Events instead of a platform capability. */
function makeApiDb(){
  var caches = {staff:{}, projects:{}, tasks:{}, stock:{}};
  var listeners = {staff:[], projects:[], tasks:[], stock:[]};
  var loaded = {staff:false, projects:false, tasks:false, stock:false};

  function snapshotFor(coll){
    var docs = Object.keys(caches[coll]).map(function(id){
      var data = caches[coll][id];
      return {id:id, exists:true, data:function(){return data;}};
    });
    return {docs:docs, size:docs.length, empty:docs.length===0};
  }
  function fire(coll){
    if(!loaded[coll]) return;
    var snap = snapshotFor(coll);
    listeners[coll].forEach(function(l){ try{ l.next(snap); }catch(e){ console.error(e); } });
  }
  function applyChange(coll,id,data,deleted){
    if(deleted) delete caches[coll][id]; else caches[coll][id]=data;
    fire(coll);
  }

  function loadAll(){
    return fetch("/api/state",{credentials:"same-origin"}).then(function(r){
      if(r.status===401){ window.location.reload(); return null; }
      if(!r.ok) throw new Error("state "+r.status);
      return r.json();
    }).then(function(data){
      if(!data) return;
      ["staff","projects","tasks","stock"].forEach(function(coll){
        caches[coll]={};
        (data[coll]||[]).forEach(function(row){ caches[coll][row.id]=row.data; });
        loaded[coll]=true;
        fire(coll);
      });
    });
  }

  function connectStream(){
    var es = new EventSource("/api/stream");
    es.addEventListener("change", function(ev){
      try{
        var msg = JSON.parse(ev.data);
        applyChange(msg.collection, msg.id, msg.data, msg.deleted);
      }catch(e){ console.error(e); }
    });
    es.onerror = function(){ /* browser auto-reconnects EventSource */ };
    return es;
  }

  function request(method,path,body){
    return fetch(path,{
      method:method, credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body: body!==undefined? JSON.stringify(body) : undefined
    }).then(function(r){
      if(r.status===401){ window.location.reload(); return Promise.reject({code:"not_granted"}); }
      if(r.status===403){ return Promise.reject({code:"invalid_argument",message:"read-only"}); }
      if(!r.ok) return r.json().catch(function(){return {};}).then(function(j){
        return Promise.reject({code:"unavailable",message:j.error||("HTTP "+r.status)});
      });
      return r.json().catch(function(){return {};});
    });
  }

  var db = {
    collection: function(name){
      return {
        limit: function(){ return this; }, // full set is always small; server sends everything
        onSnapshot: function(next,err){
          var l={next:next,err:err};
          listeners[name].push(l);
          if(loaded[name]) next(snapshotFor(name));
          return function(){
            listeners[name]=listeners[name].filter(function(x){return x!==l;});
          };
        }
      };
    },
    doc: function(path){
      var parts = path.split("/");
      var coll = parts[0], id = parts[1];
      return {
        set: function(data){
          caches[coll][id]=data; fire(coll); // optimistic
          return request("PUT","/api/"+coll+"/"+encodeURIComponent(id),data);
        },
        delete: function(){
          delete caches[coll][id]; fire(coll); // optimistic
          return request("DELETE","/api/"+coll+"/"+encodeURIComponent(id));
        }
      };
    }
  };

  return loadAll().then(function(){ connectStream(); return db; });
}

/* ============ boot ============ */
render();

(async function connect(){
  var db=null;
  try{ db = await makeApiDb(); }catch(e){ db=null; console.warn("connect failed",e); }
  if(!db){
    S.db=null;
    document.getElementById("view").insertAdjacentHTML("afterbegin",
      '<div class="banner">Could not reach the server — changes here will not be saved. Try reloading.</div>');
    return;
  }
  S.db=db;
  var onErr=function(e){ if(e&&e.code==="invalid_argument"){ S.writable=false; render(); } console.warn("db",e); };
  db.collection("staff").onSnapshot(function(snap){
    S.staff = snap.docs.map(function(d){var o=d.data()||{};var r={id:d.id};for(var k in o)r[k]=o[k];return r;})
      .sort(function(a,b){return (a.order||0)-(b.order||0) || (a.name<b.name?-1:1);});
    if(!S.me){
      var saved=lsGet("jwl.me");
      if(saved&&staffById(saved)) S.me=saved;
    }
    render();
  },onErr);
  db.collection("projects").onSnapshot(function(snap){
    S.projects = snap.docs.map(function(d){var o=d.data()||{};var r={id:d.id};for(var k in o)r[k]=o[k];return r;})
      .sort(function(a,b){return (a.deadline||"9999")<(b.deadline||"9999")?-1:1;});
    render();
  },onErr);
  db.collection("tasks").onSnapshot(function(snap){
    S.tasks = snap.docs.map(function(d){var o=d.data()||{};var r={id:d.id};for(var k in o)r[k]=o[k];
      if(!Array.isArray(r.subtasks)) r.subtasks=[]; return r;});
    S.ready=true; render();
  },onErr);
  db.collection("stock").onSnapshot(function(snap){
    S.stock = snap.docs.map(function(d){var o=d.data()||{};var r={id:d.id};for(var k in o)r[k]=o[k];
      if(!r.qty||typeof r.qty!=="object") r.qty={}; return r;});
    render();
  },onErr);
})();

})();
</script>
